apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: app
data:
  # Maps to kafka-config.bootstrap-servers in application.yml
  KAFKA_CONFIG_BOOTSTRAP_SERVERS: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  # Maps to kafka-config.schema-registry-url in application.yml
  KAFKA_CONFIG_SCHEMA_REGISTRY_URL: "http://schema-registry.kafka.svc.cluster.local:8081"
