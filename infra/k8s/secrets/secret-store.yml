# ClusterSecretStore: tells External Secrets Operator to use GCP Secret Manager
# Replace YOUR_PROJECT_ID, YOUR_REGION, YOUR_CLUSTER_NAME with real values
# (or use envsubst in deploy.yml to inject them)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
spec:
  provider:
    gcpsm:
      projectID: "YOUR_PROJECT_ID"
      auth:
        workloadIdentity:
          clusterLocation: "YOUR_REGION"
          clusterName: "YOUR_CLUSTER_NAME"
          serviceAccountRef:
            name: eso-sa
            namespace: external-secrets
