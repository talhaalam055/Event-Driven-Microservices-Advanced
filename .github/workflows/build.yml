name: Build and Push Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - "infra/helm/**"
      - "dockerfiles/**"
      - "**.md"

env:
  REGION: us-central1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build all service JARs
        run: mvn clean package -DskipTests

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Fetch CI config from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            registry_url:${{ vars.GCP_PROJECT_ID }}/ci-registry-url

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/order-service/Dockerfile
          push: true
          tags: |
            ${{ steps.secrets.outputs.registry_url }}/order-service:${{ github.sha }}
            ${{ steps.secrets.outputs.registry_url }}/order-service:latest

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/payment-service/Dockerfile
          push: true
          tags: |
            ${{ steps.secrets.outputs.registry_url }}/payment-service:${{ github.sha }}
            ${{ steps.secrets.outputs.registry_url }}/payment-service:latest

      - name: Build and push restaurant-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/restaurant-service/Dockerfile
          push: true
          tags: |
            ${{ steps.secrets.outputs.registry_url }}/restaurant-service:${{ github.sha }}
            ${{ steps.secrets.outputs.registry_url }}/restaurant-service:latest

      - name: Build and push customer-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/customer-service/Dockerfile
          push: true
          tags: |
            ${{ steps.secrets.outputs.registry_url }}/customer-service:${{ github.sha }}
            ${{ steps.secrets.outputs.registry_url }}/customer-service:latest
